[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arsvox-contracts"
version = "0.1.0"
description = "Ars-Vox wire contracts: events, commands, config — single source of truth"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools.packages.find]
include = ["arsvox_contracts*"]
