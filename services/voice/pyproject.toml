[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arsvox-voice"
version = "0.1.0"
description = "Ars-Vox voice gateway: wake word, VAD, STT, pipeline (provider-stubbed)"
requires-python = ">=3.11"
dependencies = ["arsvox-contracts==0.1.0"]

[tool.setuptools.packages.find]
include = ["arsvox_voice*"]

[tool.uv.sources]
arsvox-contracts = { workspace = true }
