[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arsvox-agent"
version = "0.1.0"
description = "Ars-Vox agent service: FastAPI + WebSocket, PydanticAI runtime, policy, tools"
requires-python = ">=3.11"
dependencies = [
    "arsvox-contracts==0.1.0",
    "arsvox-memory==0.1.0",
    "arsvox-voice==0.1.0",
    "arsvox-tts==0.1.0",
    "pydantic-ai==2.25.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # BROWSER-USE INTEGRATION: in-process text-first browser engine
    # (local Chromium via CDP). Pinned — the API moves fast and the
    # actor/ package is labeled legacy. Chromium is a separate one-time
    # `browser-use install` download.
    "browser-use==0.13.7",
]

[tool.setuptools.packages.find]
include = ["arsvox_agent*"]

[tool.uv.sources]
arsvox-contracts = { workspace = true }
arsvox-memory = { workspace = true }
arsvox-voice = { workspace = true }
arsvox-tts = { workspace = true }
