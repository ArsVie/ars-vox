[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arsvox-agent"
version = "0.1.0"
description = "Ars-Vox agent service: FastAPI + WebSocket, PydanticAI runtime, policy, tools"
requires-python = ">=3.11"
dependencies = [
    "arsvox-contracts==0.1.0",
    "arsvox-memory==0.1.0",
    "arsvox-voice==0.1.0",
    "arsvox-tts==0.1.0",
    "pydantic-ai>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["arsvox_agent*"]
