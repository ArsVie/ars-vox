[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arsvox-memory"
version = "0.1.0"
description = "Ars-Vox authoritative memory: SQLite + FTS5, domain repos"
requires-python = ">=3.11"
dependencies = ["arsvox-contracts==0.1.0"]

[tool.setuptools.packages.find]
include = ["arsvox_memory*"]
