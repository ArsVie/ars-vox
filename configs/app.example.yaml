# Template copy of the Ars-Vox configuration. Copy to configs/app.yaml
# and adjust. Full reference: configs/app.yaml (committed with comments).

app:
  name: Ars-Vox
  locale: es

server:
  host: 127.0.0.1
  port: 8765

agent:
  mock: false
  model:
    provider: opencode-go
    base_url: https://opencode.ai/zen/go/v1/
    api_key_env: OPENCODE_GO_API_KEY
    name: deepseek-v4-flash
    temperature: 0.2
    timeout_s: 90
    max_steps: 8
  system_prompt_file: null
  recent_turns_in_context: 6

voice:
  enabled: false
  wake_word: { enabled: false, model: null }
  vad: { provider: silero }
  stt: { provider: mock, model: tiny }
  silence_timeout_s: 60
  wake_sound: null
  sleep_sound: null

tts:
  provider: mock
  auto_speak: false
  es_voice: null
  speed: 1.0
  queue_max: 20

ui:
  templates: [focus, split, reference, background_media]
  reduced_motion: false
  large_text: false
  high_contrast: false
  default_template: focus
  default_primary: conversation

telegram:
  mock: true
  token_env: TELEGRAM_BOT_TOKEN
  chat_id: ""

memory:
  db_path: data/arsvox.db
  library_dir: data/library
  documents_dir: data/documents

reminders:
  scheduler_interval_s: 5
  snooze_seconds: 600
  confirmation_timeout_s: 120

browser:
  allowlist: ["youtube.com", "*.youtube.com", "wikipedia.org", "openstreetmap.org"]
  home_url: https://www.youtube.com

media:
  sample_video_url: https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4

demo:
  enabled: false
  step_delay_s: 6
