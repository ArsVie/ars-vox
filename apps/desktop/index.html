<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ars Vox</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Ars Vox</h1>
    <div class="status">
      <span id="indicator" class="square idle" title="estado"></span>
      <span id="status-text">listo</span>
      <button id="settings-open" class="settings-button" type="button">ajustes</button>
    </div>
  </header>

  <section id="settings" hidden>
    <div class="settings-card">
      <h2>Ajustes</h2>
      <label for="cfg-books">Carpeta de los libros</label>
      <input id="cfg-books" type="text" spellcheck="false" placeholder="C:\Users\...\Documents" />
      <label for="cfg-music">Carpeta de la música</label>
      <input id="cfg-music" type="text" spellcheck="false" placeholder="C:\Users\...\Music" />
      <div class="settings-actions">
        <button id="cfg-save" class="send" type="button">Guardar</button>
        <button id="cfg-close" type="button">Cerrar</button>
        <span id="cfg-status" class="cfg-status" role="status"></span>
      </div>
    </div>
  </section>

  <div id="workspace">
    <main id="conversation" aria-live="polite"></main>

    <section id="panel" hidden>
      <header class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="panel-grow" class="panel-button" type="button">agrandar</button>
        <button id="panel-close" class="panel-button" type="button" title="quitar del panel" aria-label="quitar del panel">✕</button>
      </header>
      <p id="panel-note" class="panel-note" hidden></p>
      <div id="offers" class="offers" hidden></div>
      <div id="stage" class="stage" hidden></div>
      <div id="controls" class="controls" hidden>
        <button id="ctl-play" class="ctl-play" type="button" aria-label="reproducir o pausar">▶</button>
        <span id="ctl-time" class="ctl-time">0:00</span>
        <input id="ctl-seek" class="ctl-seek" type="range" min="0" max="0" step="1" value="0" aria-label="posición" />
        <span id="ctl-duration" class="ctl-time">0:00</span>
        <input id="ctl-volume" class="ctl-volume" type="range" min="0" max="100" step="5" value="100" aria-label="volumen" />
      </div>
    </section>
  </div>

  <div id="thinking" hidden>pensando…</div>

  <footer>
    <button id="stop" class="stop">DETENER</button>
    <button id="talk" class="talk">HABLAR</button>
    <input id="text" type="text" autocomplete="off"
           placeholder="Escriba o dicte lo que necesita" />
    <button id="send" class="send">Enviar</button>
  </footer>

  <template id="bubble-template">
    <article class="bubble">
      <p class="text"></p>
      <div class="meta">
        <button class="listen" type="button">escuchar</button>
        <span class="time"></span>
      </div>
    </article>
  </template>

  <template id="card-template">
    <button class="card" type="button">
      <span class="card-title"></span>
      <span class="card-sub"></span>
    </button>
  </template>

  <script src="app.js"></script>
</body>
</html>
